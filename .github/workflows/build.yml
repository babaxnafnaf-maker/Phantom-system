name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération des fichiers
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Création du projet Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MonApp" "com.monapp.app" --web-dir="www"
          npx cap add android
          npx cap sync

      - name: Compilation de l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MonApplication-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
