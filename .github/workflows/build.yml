name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération des fichiers
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Acceptation des licences Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Création du projet Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 -iname "*.html" -exec cp "{}" www/index.html \;
          if [ ! -f www/index.html ]; then
            echo "ERREUR : Aucun fichier .html trouvé à la racine du dépôt !"
            exit 1
          fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Phantom System" "com.phantom.system" --web-dir="www"
          npx cap add android
          npx cap sync

      - name: Compilation de l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Export de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-System-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
